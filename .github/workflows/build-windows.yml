name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke -- --interaction-test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: RabbitDesktopPet-Windows-x64
          path: release/RabbitDesktopPet-*-portable.exe
          if-no-files-found: error
