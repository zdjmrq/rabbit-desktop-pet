<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>写实小兔子桌宠</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important;pointer-events:none;user-select:none}
    #startup-error{display:none;position:fixed;inset:12px auto auto 12px;color:#b00020;background:#fff;padding:8px;pointer-events:none}
  </style>
</head>
<body>
  <pre id="startup-error"></pre>
  <script>
    window.addEventListener('error',event=>{const el=document.getElementById('startup-error');el.textContent+=`${event.message}\n${event.error?.stack||''}`})
    window.addEventListener('unhandledrejection',event=>{const el=document.getElementById('startup-error');el.textContent+=`${event.reason?.stack||event.reason}`})
  </script>
  <script src="dist/renderer.js"></script>
</body>
</html>
